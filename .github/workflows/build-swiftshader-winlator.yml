name: Build SwiftShader Vulkan for Winlator Frost v3 (aarch64 glibc)

# Produces ONE archive (SwiftShader is Vulkan-only; there is no desktop-OpenGL
# build to package -- desktop GL on a SwiftShader stack is served by the
# EXISTING zink archive running on top of SwiftShader's Vulkan device):
#   swiftshader-vulkan-<shortsha>.tzst
#     usr/lib/libvulkan_swiftshader.so              -> SwiftShader Vulkan ICD
#        (upstream file name libvk_swiftshader.so, renamed here to match this
#         project's libvulkan_<driver>.so convention; safe because the ICD
#         manifest references it by absolute path and nothing links it by
#         SONAME)
#     usr/share/vulkan/icd.d/swiftshader_icd.aarch64.json -> loader manifest
# The archive may ALSO conditionally contain usr/lib/libtinfo.so.6 and/or
# usr/lib/libsensors.so.5 -- private bundled copies, added automatically
# only if the produced binary actually links against them (detected via
# readelf after the build; in practice SwiftShader's vendored-LLVM static
# link needs neither, so expect exactly 2 files).
#
# Frost-v3 integration (see GraphicsDrivers.SWIFTSHADER,
# DefaultVersion.SWIFTSHADER, XServerDisplayActivity.extractGraphicsDriverFiles):
#   - Vulkan slot "SwiftShader" extracts
#       assets/graphics_driver/swiftshader-vulkan-<DefaultVersion.SWIFTSHADER>.tzst
#     into RootFS rootDir (<files>/rootfs). No GALLIUM_DRIVER override; the ICD
#     manifest selects SwiftShader. WSI present mode follows this project's
#     Turnip policy (mailbox).
#   - There is deliberately NO SwiftShader entry in the OpenGL slot and NO
#     swiftshader-opengl archive: SwiftShader implements Vulkan 1.3 (conformant)
#     only. A "SwiftShader graphics stack" = Vulkan slot SwiftShader +
#     OpenGL slot Zink (Zink-on-SwiftShader is the desktop-GL path, same role
#     Zink plays on top of lavapipe). No new GL asset is needed.
#   - DefaultVersion.DXVK() treats swiftshader like turnip (Vulkan 1.3
#     conformant -> MAJOR_DXVK; DXVK-on-SwiftShader is an established combo).
#   - Place the produced .tzst under
#       app/app/src/main/assets/graphics_driver/
#     (aaptOptions already has noCompress for tzst, so no gradle change needed).
#   - Versioning: SwiftShader has no releases; the build is pinned to a commit.
#     DefaultVersion.SWIFTSHADER is the 7-char short SHA of the pinned commit.
#     If you change the sw_revision input, update DefaultVersion.SWIFTSHADER to
#     the new short SHA and rebuild, otherwise the asset filename won't match
#     (the app's post-extract verification will log this instead of silently
#     breaking, but it still won't work until the names agree).
#
# Build facts verified against upstream (google/swiftshader master):
#   - REACTOR_BACKEND MUST be LLVM (or LLVM-Submodule) on aarch64. Subzero --
#     the LLVM-free JIT -- explicitly does not support ARM64 (upstream
#     src/Reactor/BUILD.gn: use_swiftshader_with_subzero excludes arm64).
#     There is no LLVM-free aarch64 build; accept the vendored LLVM 10 slice.
#   - The LLVM used is SwiftShader's own vendored third_party/llvm-10.0
#     (in-repo, no download) and it is linked STATICALLY into
#     libvk_swiftshader.so, so the driver has NO runtime libLLVM dependency
#     (the ABI gate below asserts this). This is the structural advantage over
#     the Mesa build if that one ever proves unloadable: fewer moving parts.
#   - XCB WSI (what Winlator's X server needs for swapchain presentation) is
#     ON by default on Linux (SWIFTSHADER_BUILD_WSI_XCB=TRUE); Wayland is
#     explicitly disabled here to avoid needing Wayland protocol headers.
#     Only libx11/libxcb headers are installed for WSI.
#   - Only the vk_swiftshader target is built (not EGL/GLES, tests,
#     benchmarks, or samples), and SWIFTSHADER_BUILD_TESTS=FALSE, so the only
#     submodules required are SPIRV-Tools + SPIRV-Headers (shallow).
#   - SWIFTSHADER_WARNINGS_AS_ERRORS=FALSE: old vendored sources + a newer
#     host clang would otherwise fail on new warnings. Deliberate robustness
#     flag, not a code-quality statement.
#   - Host compiler is clang-15 (jammy's); C++17 per upstream CMakeLists.
#   - Base image ubuntu:22.04 (jammy, glibc 2.35) for the same backward-
#     compatible ABI reason as the llvmpipe workflow (2.35-linked binary loads
#     on the rootfs's glibc 2.39). The ABI diagnostic prints actual max
#     GLIBC/GLIBCXX versions required.
#   - Expect a LONG build: the vendored LLVM slice plus SwiftShader itself,
#     all under QEMU user-mode emulation. Timeout is 360 minutes (runner max).

on:
  workflow_dispatch:
    inputs:
      sw_revision:
        description: "SwiftShader commit SHA to build (must update DefaultVersion.SWIFTSHADER to its short SHA)"
        required: true
        default: "694585a05946e1ed49b6bd577ca6537cbb57f025"
      vulkan_api_version:
        description: "api_version field written into the SwiftShader ICD json (SwiftShader is Vulkan 1.3 conformant)"
        required: true
        default: "1.3.0"
      icd_library_path:
        description: "Absolute library_path baked into the ICD json (must match where frost-v3 extracts libvulkan_swiftshader.so on-device: <files>/rootfs/usr/lib, written with the /lib/ prefix convention of the turnip/vortek reference manifests)"
        required: true
        default: "/data/data/com.winlator/files/rootfs/lib/libvulkan_swiftshader.so"

env:
  SW_REVISION: ${{ github.event.inputs.sw_revision || '694585a05946e1ed49b6bd577ca6537cbb57f025' }}
  VULKAN_API_VERSION: ${{ github.event.inputs.vulkan_api_version || '1.3.0' }}
  ICD_LIBRARY_PATH: ${{ github.event.inputs.icd_library_path || '/data/data/com.winlator/files/rootfs/lib/libvulkan_swiftshader.so' }}
  TARGET_TRIPLE: aarch64-linux-gnu

jobs:
  build-swiftshader:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Mandatory: registers binfmt_misc handlers so the amd64 runner can
      # execute aarch64 ELF binaries transparently. Without this every
      # command inside --platform=linux/arm64 below fails with "exec format error".
      - name: Set up QEMU (aarch64 emulation)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create output directory
        run: mkdir -p "${{ github.workspace }}/artifacts"

      - name: Write in-container build script
        run: |
          cat > "${{ github.workspace }}/build.sh" <<'BUILD_SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive

          SW_REVISION="${SW_REVISION:?}"
          VULKAN_API_VERSION="${VULKAN_API_VERSION:?}"
          ICD_LIBRARY_PATH="${ICD_LIBRARY_PATH:?}"
          SHORT_SHA="$(echo "$SW_REVISION" | cut -c1-7)"
          echo "==> SwiftShader revision ${SW_REVISION} (short ${SHORT_SHA})"

          echo "==> Neutralizing ldconfig inside the emulated container"
          # DETERMINISTIC fix for the QEMU user-mode ldconfig SIGSEGV, same as
          # the llvmpipe workflow: the emulated aarch64 ldconfig segfaults
          # under QEMU (2026-09-07 llvmpipe runs, binfmt qemu v10.2.3: dpkg exit
          # 139 on libc-bin, apt exit 100), and --no-triggers alone proved
          # insufficient (a large install still executes the libc-bin trigger
          # pass at the end). Safe: the build only needs files on disk, never
          # the ld.so cache. Container is ephemeral, no restore needed.
          if LDCONFIG_PATH="$(command -v ldconfig)"; then
            mv "$LDCONFIG_PATH" "${LDCONFIG_PATH}.qemu-broken"
            printf '#!/bin/sh\nexit 0\n' > "$LDCONFIG_PATH"
            chmod +x "$LDCONFIG_PATH"
            echo "ldconfig neutralized at ${LDCONFIG_PATH}"
          fi

          echo "==> Updating apt and installing mandatory build dependencies"
          apt-get update
          echo "==> Confirming base image glibc version"
          ldd --version | head -n1 || true
          # clang-15: upstream-tested compiler family for C++17 + vendored
          # LLVM 10 sources. X11/XCB headers: needed to compile the XCB WSI
          # backend (on by default on Linux; Wayland disabled at configure).
          # -o Dpkg::Options::="--no-triggers" is MANDATORY under QEMU
          # user-mode emulation: dpkg's libc-bin trigger executes the emulated
          # aarch64 ldconfig, which segfaults under QEMU (observed 2026-09-07
          # on the llvmpipe workflow with binfmt qemu v10.2.3: "qemu: uncaught
          # target signal 11", dpkg exit 139, apt exit 100). Skipping trigger
          # processing is safe: the build only needs files/headers/binaries on
          # disk, not the ld.so cache.
          apt-get -o Dpkg::Options::="--no-triggers" install -y --no-install-recommends \
            ca-certificates curl xz-utils git \
            build-essential pkg-config cmake ninja-build \
            python3 \
            clang-15 \
            libx11-dev libxcb1-dev libx11-xcb-dev \
            zstd
          # Best-effort cache refresh; failure is tolerated (see above).
          ldconfig || true
          export CC=clang-15 CXX=clang++-15
          clang++-15 --version | head -n1
          cmake --version | head -n1

          echo "==> Cloning SwiftShader at pinned revision (shallow)"
          # Shallow fetch of the exact SHA keeps the download small; GitHub
          # allows fetching an arbitrary reachable SHA.
          mkdir -p /build && cd /build
          git init swiftshader
          cd swiftshader
          git remote add origin https://github.com/google/swiftshader.git
          git fetch --depth 1 origin "$SW_REVISION"
          git checkout FETCH_HEAD
          git submodule update --init --depth 1 third_party/SPIRV-Tools third_party/SPIRV-Headers

          echo "==> Configuring build (vk_swiftshader target only)"
          # REACTOR_BACKEND=LLVM is MANDATORY on aarch64: Subzero (the
          # LLVM-free JIT) has no ARM64 codegen (upstream BUILD.gn excludes
          # arm64), so an LLVM-free aarch64 build does not exist.
          # SWIFTSHADER_BUILD_TESTS=FALSE keeps googletest/glslang submodules
          # out of the build; only SPIRV-Tools/Headers (above) are required.
          cmake -S . -B build -GNinja -DCMAKE_BUILD_TYPE=Release \
            -DREACTOR_BACKEND=LLVM \
            -DSWIFTSHADER_BUILD_TESTS=FALSE \
            -DSWIFTSHADER_BUILD_BENCHMARKS=FALSE \
            -DSWIFTSHADER_BUILD_WSI_XCB=TRUE \
            -DSWIFTSHADER_BUILD_WSI_WAYLAND=FALSE \
            -DSWIFTSHADER_WARNINGS_AS_ERRORS=FALSE

          echo "==> Building vk_swiftshader (this takes a while under emulation)"
          cmake --build build --target vk_swiftshader --parallel "$(nproc)"

          echo "==> Locating build output"
          VK_SRC="$(find build -name 'libvk_swiftshader.so' -type f | head -n1)" || true
          if [ -z "$VK_SRC" ] || [ ! -f "$VK_SRC" ]; then
            echo "FATAL: libvk_swiftshader.so was not produced" >&2
            find build -name '*.so*' | head -n20 >&2 || true
            exit 1
          fi
          echo "Built: $VK_SRC ($(du -h "$VK_SRC" | cut -f1))"

          echo "==> Assembling the archive frost-v3's extraction code expects"
          # Vulkan slot "SwiftShader" extracts
          #   graphics_driver/swiftshader-vulkan-<shortsha>.tzst
          # into RootFS rootDir (<files>/rootfs).
          rm -rf /pkg
          mkdir -p /pkg/vulkan/usr/lib /pkg/vulkan/usr/share/vulkan/icd.d

          # Renamed to this project's libvulkan_<driver>.so convention. Safe:
          # the ICD manifest below references it by absolute path and nothing
          # links against it by SONAME (it is dlopened by the Vulkan loader).
          cp -a "$VK_SRC" /pkg/vulkan/usr/lib/libvulkan_swiftshader.so

          echo "==> Checking for libtinfo/libsensors and bundling private copies if needed"
          # Same self-healing step as the llvmpipe workflow: detect from the
          # produced binary instead of assuming. SwiftShader's statically
          # linked vendored LLVM is not expected to need either (expect 2
          # files), but a toolchain surprise must not ship a dead driver.
          mkdir -p /tmp/extra-libs
          NEEDS_TINFO_VK=0; NEEDS_SENSORS_VK=0
          if readelf -d /pkg/vulkan/usr/lib/libvulkan_swiftshader.so | grep -q 'NEEDED.*libtinfo\.so\.6'; then
            NEEDS_TINFO_VK=1
          fi
          if readelf -d /pkg/vulkan/usr/lib/libvulkan_swiftshader.so | grep -q 'NEEDED.*libsensors\.so\.5'; then
            NEEDS_SENSORS_VK=1
          fi

          echo "libvulkan_swiftshader needs libtinfo: ${NEEDS_TINFO_VK}, libsensors: ${NEEDS_SENSORS_VK}"

          if [ "$NEEDS_TINFO_VK" = "1" ]; then
            apt-get download libtinfo6
            dpkg-deb -x libtinfo6_*.deb /tmp/extra-libs
            TINFO_SRC="$(find /tmp/extra-libs -name 'libtinfo.so.6' | head -n1)" || true
            if [ -z "$TINFO_SRC" ]; then
              echo "FATAL: libtinfo6 .deb did not contain libtinfo.so.6" >&2
              exit 1
            fi
            cp -L "$TINFO_SRC" /pkg/vulkan/usr/lib/libtinfo.so.6
          fi

          if [ "$NEEDS_SENSORS_VK" = "1" ]; then
            apt-get download libsensors5
            dpkg-deb -x libsensors5_*.deb /tmp/extra-libs
            SENSORS_SRC="$(find /tmp/extra-libs -name 'libsensors.so.5' | head -n1)" || true
            if [ -z "$SENSORS_SRC" ]; then
              echo "FATAL: libsensors5 .deb did not contain libsensors.so.5" >&2
              exit 1
            fi
            cp -L "$SENSORS_SRC" /pkg/vulkan/usr/lib/libsensors.so.5
          fi

          cat > /pkg/vulkan/usr/share/vulkan/icd.d/swiftshader_icd.aarch64.json <<EOF
          {
              "ICD": {
                  "api_version": "${VULKAN_API_VERSION}",
                  "library_path": "${ICD_LIBRARY_PATH}"
              },
              "file_format_version": "1.0.0"
          }
          EOF

          echo "==> Verifying package file count"
          VK_COUNT="$(find /pkg/vulkan -type f | wc -l)"
          # Baseline is 2 files (driver + icd json) plus one extra file for
          # each of libtinfo/libsensors conditionally bundled above.
          VK_EXPECTED=$((2 + NEEDS_TINFO_VK + NEEDS_SENSORS_VK))
          if [ "$VK_COUNT" -ne "$VK_EXPECTED" ]; then
            echo "FATAL: vulkan package expected ${VK_EXPECTED} files, found ${VK_COUNT}" >&2
            find /pkg/vulkan -type f >&2
            exit 1
          fi

          echo "==> Packaging as .tzst archive"
          cd /pkg/vulkan
          tar --zstd -cf "/artifacts/swiftshader-vulkan-${SHORT_SHA}.tzst" $(find . -type f -printf '%P\n')
          sha256sum "/artifacts/swiftshader-vulkan-${SHORT_SHA}.tzst" \
            > "/artifacts/swiftshader-vulkan-${SHORT_SHA}.tzst.sha256"

          echo "==> Contents:"
          tar --zstd -tvf "/artifacts/swiftshader-vulkan-${SHORT_SHA}.tzst"

          echo "==> Done"
          ls -lh /artifacts
          BUILD_SCRIPT
          chmod +x "${{ github.workspace }}/build.sh"

      - name: Build inside emulated aarch64 ubuntu:22.04 container
        run: |
          docker run --rm \
            --platform linux/arm64 \
            -e SW_REVISION="${{ env.SW_REVISION }}" \
            -e VULKAN_API_VERSION="${{ env.VULKAN_API_VERSION }}" \
            -e ICD_LIBRARY_PATH="${{ env.ICD_LIBRARY_PATH }}" \
            -v "${{ github.workspace }}/build.sh:/build.sh:ro" \
            -v "${{ github.workspace }}/artifacts:/artifacts" \
            ubuntu:22.04 \
            bash /build.sh

      - name: Verify archive is well-formed and contains the mandatory files
        run: |
          SHORT_SHA="$(echo '${{ env.SW_REVISION }}' | cut -c1-7)"
          VK_FILE="artifacts/swiftshader-vulkan-${SHORT_SHA}.tzst"
          test -s "$VK_FILE"
          zstd -t "$VK_FILE"

          # Entry counts are not fixed: libtinfo.so.6 / libsensors.so.5 are
          # bundled only if the produced binary actually needs them, so check
          # for the MANDATORY files' presence instead of an exact count.
          VK_LISTING="$(tar --zstd -tf "$VK_FILE")"

          if ! echo "$VK_LISTING" | grep -qx 'usr/lib/libvulkan_swiftshader.so'; then
            echo "FATAL: vulkan archive is missing usr/lib/libvulkan_swiftshader.so" >&2
            echo "$VK_LISTING" >&2
            exit 1
          fi
          if ! echo "$VK_LISTING" | grep -qx 'usr/share/vulkan/icd.d/swiftshader_icd.aarch64.json'; then
            echo "FATAL: vulkan archive is missing the ICD json" >&2
            echo "$VK_LISTING" >&2
            exit 1
          fi

          # The ICD manifest must point at frost-v3's rootfs lib dir with the
          # /lib/ prefix convention of the turnip/vortek reference manifests,
          # NOT an imagefs path -- otherwise the Vulkan loader looks in a
          # nonexistent directory and SwiftShader never enumerates.
          # (<rootfs>/lib symlinks to usr/lib, where the archive actually
          # extracts the .so, so both spellings resolve -- but the /lib/
          # spelling is what is proven to work.)
          mkdir -p /tmp/icd-check
          tar --zstd -xf "$VK_FILE" -C /tmp/icd-check usr/share/vulkan/icd.d/swiftshader_icd.aarch64.json
          echo "ICD manifest content:"
          cat /tmp/icd-check/usr/share/vulkan/icd.d/swiftshader_icd.aarch64.json
          if ! grep -q '"library_path": "/data/data/com.winlator/files/rootfs/lib/libvulkan_swiftshader.so"' /tmp/icd-check/usr/share/vulkan/icd.d/swiftshader_icd.aarch64.json; then
            echo "WARNING: ICD library_path is not the frost-v3 rootfs path -- check icd_library_path input" >&2
          fi

          echo "vulkan archive OK: $(du -h "$VK_FILE" | cut -f1)"
          echo "$VK_LISTING"

      - name: Diagnose ABI compatibility of produced binary
        run: |
          SHORT_SHA="$(echo '${{ env.SW_REVISION }}' | cut -c1-7)"
          mkdir -p /tmp/abi-check
          tar --zstd -xf "artifacts/swiftshader-vulkan-${SHORT_SHA}.tzst" -C /tmp/abi-check
          sudo apt-get install -y --no-install-recommends binutils-aarch64-linux-gnu > /dev/null
          f=/tmp/abi-check/usr/lib/libvulkan_swiftshader.so
          echo "--- $f ---"
          echo "File type / architecture (must be ARM aarch64):"
          file "$f"
          MACHINE="$(aarch64-linux-gnu-readelf -h "$f" | grep 'Machine:' || true)"
          echo "$MACHINE"
          if ! echo "$MACHINE" | grep -q 'AArch64'; then
            echo "FATAL: $f is not an AArch64 binary -- the emulated arm64 build did not take effect" >&2
            exit 1
          fi
          echo "NEEDED (runtime library dependencies -- expect only libc/m/libstdc++/libdl):"
          aarch64-linux-gnu-readelf -d "$f" | grep NEEDED || true
          echo "Max GLIBC symbol version required:"
          aarch64-linux-gnu-objdump -T "$f" 2>/dev/null | grep -oP 'GLIBC_[0-9.]+' | sort -V -u | tail -1 || true
          echo "Max GLIBCXX symbol version required:"
          aarch64-linux-gnu-objdump -T "$f" 2>/dev/null | grep -oP 'GLIBCXX_[0-9.]+' | sort -V -u | tail -1 || true
          if aarch64-linux-gnu-readelf -d "$f" | grep -qi 'NEEDED.*libLLVM'; then
            echo "FATAL: $f still depends on a shared libLLVM -- vendored LLVM was not statically linked" >&2
            exit 1
          fi

      - name: Upload driver artifacts
        uses: actions/upload-artifact@v4
        with:
          name: swiftshader-${{ env.SW_REVISION }}-aarch64
          path: |
            artifacts/swiftshader-vulkan-*.tzst
            artifacts/swiftshader-vulkan-*.tzst.sha256
          if-no-files-found: error
          retention-days: 30
