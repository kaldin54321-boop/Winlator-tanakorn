name: Build VirGL (virpipe) for Winlator Frost v3 (aarch64 glibc)

# Produces ONE archive, matching exactly what this project's
# XServerDisplayActivity.extractGraphicsDriverFiles() extracts for the
# OpenGL slot (VirGL is OpenGL-slot-only; there is no VirGL Vulkan ICD):
#   virgl-<version>.tzst
#     usr/lib/libGL.so.1.7.0  -> virpipe gallium driver baked straight into
#                                classic libGL (Xlib GLX target, NOT a separate
#                                dri/*.so plugin)
# The archive may ALSO conditionally contain private bundled copies, added
# automatically only if the produced binary actually links against them
# (detected via readelf after the build):
#   usr/lib/libtinfo.so.6, usr/lib/libsensors.so.5,
#   usr/lib/libxcb-xfixes.so.0, usr/lib/libxshmfence.so.1,
#   usr/lib/libxcb-keysyms.so.1
#
# Frost-v3 integration (see GraphicsDrivers.VIRGL, DefaultVersion.VIRGL,
# XServerDisplayActivity.extractGraphicsDriverFiles):
#   - OpenGL slot "VirGL" extracts
#       assets/graphics_driver/virgl-<DefaultVersion.VIRGL>.tzst
#     into RootFS rootDir (<files>/rootfs). After dropping the produced
#     .tzst under app/app/src/main/assets/graphics_driver/, bump
#     DefaultVersion.VIRGL to the built version (e.g. "25.0.7"). No other
#     app change is needed:
#     - the cacheId already contains DefaultVersion.valueOf("virgl"), so the
#       version bump alone forces a one-time re-extract AND drops the stale
#       on-disk Mesa shader cache (compiled code from 23.1.9 must never be
#       reused -- its keys do not capture the driver build);
#     - env is already owned by the VIRGL branch (GALLIUM_DRIVER=virpipe,
#       VIRGL_NO_READBACK=true, VIRGL_SERVER_PATH plus VirGLConfigDialog
#       extras) -- do NOT add overrides here;
#     - mesaDriverMode stays true (the default): virgl is served by the
#       Mesa-dialect GLX like zink/llvmpipe; only Gladio opts out;
#     - verification expects exactly libGL.so.1.7.0 for every OpenGL slot,
#       which is what this archive provides (the base rootfs ships the
#       libGL.so.1 symlink pointing at it).
#   - aaptOptions already has noCompress for tzst, so no gradle change needed.
#
# Host side (NOT built here, intentionally): the in-app libvirglrenderer.so
# under app/.../cpp/virglrenderer stays as-is, and it KEEPS WORKING with the
# old virgl-23.1.9 asset: nothing below changes the host protocol, so the old
# asset remains a safe fallback.
#
# Wire protocol (READ THIS BEFORE CHANGING ANYTHING): the frozen host speaks
# the CLASSIC vtest wire format -- command ids 1-9 (1=CREATE_RENDERER with NO
# payload, 2=GET_CAPS as a single request, 3=RESOURCE_CREATE as 11 words with
# trailing backing size plus an SHM fd passed back, 4=RESOURCE_DESTROY,
# 5/6=TRANSFER_GET/PUT as 10 words, SHM-backed, no bulk payload, 7=SUBMIT_CMD,
# 8=RESOURCE_BUSY_WAIT, 9=FLUSH_FRONTBUFFER as [handle, drawable] -- the host
# presents from its own GL FBO on 9 and Java flushFrontbuffer copies it into
# the X drawable; stock vtest never sends 9, so the W7 hunk emits it from
# virgl_vtest_flush_frontbuffer), socket env VIRGL_SERVER_PATH (default
# /tmp/.virgl_server). That is the exact format the shipped virgl-23.1.9
# asset was built with (proven from its binary strings: VIRGL_SERVER_PATH,
# /tmp/.virgl_server, virgl_server_winsys.c, and no vtest symbols at all).
# Stock Mesa >= 24 instead speaks the RENUMBERED upstream protocol (CREATE=8
# with a process-name payload, GET_CAPS2+GET_CAPS double request, CREATE2 /
# TRANSFER2, UNREF, ping handshake, VTEST_SOCKET_NAME env) and ignores
# VIRGL_SERVER_PATH entirely -- so a stock build connects to the wrong
# socket and every GL client dies in virgl_block_read ("lost connection to
# rendering server" + abort(); GPUInfo blank, TestD3D force-closes, while the
# Wine desktop keeps rendering via MIT-SHM which needs no GL). The "Winlator
# classic wire-compat" patch step below rewrites the vtest winsys wire
# functions to the classic shapes/ids (protocol 0, SHM-backed, VIRGL_SERVER_PATH
# fallback kept), so the new virpipe CORE (the actual bug fixes) runs over the
# protocol the frozen host understands. Every hunk is anchor-verified in CI;
# any drift fails loudly with context instead of shipping a dead driver. The
# app additionally exports VTEST_SOCKET_NAME at the served socket path
# (XServerDisplayActivity VIRGL branch), so new assets resolve under either
# app generation.
#
# Blackscreen errata (the first virgl-25.0.0 asset showed as detected yet
# TestD3D stayed black at 0 FPS): context creation and caps use ids 1-2, so
# detection works even when presentation is dead. Its logcat is the smoking
# gun: submits flow (up to #3600) yet there is not a single virgl-classic
# guest line and not a single host flush line -- that asset predates the W8
# null-dt present plus the W11/X1 diagnostics, so the guest winsys dropped
# every flush upstream of the host. Findings so far: (a) frontbuffers that are
# not virgl display-target resources were dropped by the old W8 hunk, so id
# 9 was never sent (W8 now presents via id 9 regardless of dt; there is no
# DRI3 code in xlib builds at all -- verified 0 DRI3 strings in both assets
# -- so LIBGL_DRI3_DISABLE is a harmless no-op kept defensively); (b) vtest
# protocol v3 extras (blob/capset/param/submit2) have no host handler and
# would desync the stream -- blob creation is blocked at its caller (W5
# if(0)), W10 neutralizes the capset sender when present, and the host
# drains unknown commands instead of misparsing them; (c) the host flush ran
# without a current EGL context and died on unknown handles silently -- it
# now makes its context current, guards the lookup, and logs; (d) the frozen
# host's caps_v2 ends at scanout while Mesa 25's struct is longer, so
# capability_bits_v2 and later fields arrived as stack garbage (randomly
# enabling staging paths the classic wire cannot serve) -- S-getcaps now
# zero-fills and defaults max_texture_samplers; (e) the xmesa swap chain and
# resource creates are instrumented (W11/X1) because the failing builds never
# invoked the winsys flush at all -- the swap dies upstream of it; (f) the
# failing guest sent only tiny cdw=16 submits (vs cdw=1040 healthy) with zero
# draws and zero id-9 flushes, so the host now logs each submit's ccode
# breakdown plus any decode failure, and the vrend decoder skips unknown
# ccodes (NOP/render-condition/texture-barrier/QBO-decorated) instead of
# aborting the submit tail (which silently dropped draws); (g) one layer
# above the winsys, virgl_screen.c:virgl_flush_frontbuffer unconditionally
# runs virgl_flush_eq(vctx,...) and vctx->cbuf -- XMesaSwapBuffers arrives
# with ctx == NULL (xmesa_swap_st_framebuffer passes no st pipe), so the
# first swap is a NULL deref and no present ever reaches W7/W8 -- W12 guards
# both derefs (the winsys flush takes no cmdbuf, so NULL is safe); (h) the
# 25.0.7 asset DID emit id-9 flushes yet stayed black with FPS counting:
# host dropped every flush as "unknown drawable=-1610590968" (unsigned
# 2684376328 = 0xA0005508) while SHM PutImages for the real X window
# (33554508 = 0x0200004C, head=000... black) kept the FPS counter alive.
# Root cause: W7/W8 sent (uint32_t)(uintptr_t)winsys_drawable_handle, but
# that handle is NOT an XID -- it is a struct xlib_drawable* (see
# src/gallium/include/frontend/xlibsw_api.h: {Visual*, int depth, Drawable
# drawable} and xm_st.c: flush_frontbuffer(..., &xstfb->buffer->ws, ...)).
# Truncating the POINTER yields pointer low bits (0xA0...), never the XID
# at ws->drawable (offset 16 on LP64). W0 includes xlibsw_api.h and W7/W8
# now dereference ws->drawable (with a NULL guard); the host additionally
# carries the resource size for a size-based fallback so one bad drawable
# can never blackscreen again. Log signature to
# compare: healthy shows growing flush #n at 60 FPS with drawable=0x0200004C-
# style small XIDs; broken shows flushes for 0xA0... pointer values plus
# black SHM PutImages (head=000...) on the real window.
#
# Design notes:
#   - Builds run INSIDE a real aarch64 container via QEMU user-mode emulation
#     (docker/setup-qemu-action), not manual dpkg --add-architecture
#     cross-compiling. See build-llvmpipe-winlator.yml for the full rationale
#     (ldconfig SIGSEGV defense, --no-triggers hardening, jammy/glibc-2.35
#     baseline). All of it applies verbatim here and is repeated below.
#   - VERSION PIN: default Mesa 25.0.7 -- the same Mesa 25 family as the proven
#     working llvmpipe-25.0.0 asset, so guest shader behavior and the X
#     server protocol it was verified against stay in one known-good family,
#     plus 7 patch releases of virpipe/winsys/frontend fixes over 25.0.0
#     (the first 25.0.0 asset blackscreened: it predates the W8 null-dt
#     present and the W12 NULL-ctx guard, so no flush ever reached the host).
#     Mesa 24.0.x is also accepted via the mesa_version input (same recipe,
#     no removed-option hazards in the 24-25 range). There is deliberately
#     NO downgrade to 24.x/23.3: the blackscreen is a presentation/wire gap
#     the compat layer bridges, not a core rasterizer regression, and an
#     older Mesa would discard the virpipe glitch fixes that motivate this
#     upgrade from 23.1.9 in the first place. Do NOT point this at
#     Mesa 26.x without on-device proof: the in-house 26.0.0 llvmpipe build
#     enumerated correctly yet rendered clear-color/black only (shared
#     rasterizer output nothing, plausibly misbuilt under QEMU user-mode CI).
#   - LLVM is DELIBERATELY NOT INSTALLED and -Dllvm=disabled is MANDATORY.
#     The virpipe gallium driver has no JIT: it forwards TGSI over the virgl
#     wire protocol to the host renderer, so there is nothing to compile
#     guest-side. Enabling LLVM would only bloat libGL with a statically
#     linked compiler backend plus its libtinfo/libsensors/libzstd fallout
#     for zero rendering benefit. (Contrast llvmpipe, where llvm=enabled +
#     static link is mandatory because the rasterizer IS an LLVM JIT.)
#   - No glslangValidator step: with -Dvulkan-drivers= (empty) there is no
#     Vulkan ICD to build, so nothing searches for it. (The llvmpipe flow
#     needs a source-built glslangValidator only because lavapipe does.)
#   - -Dglx=xlib is the key option: it bakes the virpipe gallium driver
#     directly into libGL.so instead of producing a separate loadable
#     dri/*.so plugin, which is what lets the final package be the single
#     self-contained libGL.so.1.7.0 file the extraction code expects -- the
#     exact shape of the current virgl-23.1.9.tzst and zink-22.2.5.tzst.
#   - -Dglx-direct=true: explicit direct-rendering intent (client-side virpipe
#     raster into SHM pixmaps via MIT-SHM/DRI3, which this X server
#     implements). This is the default, but spelling it out protects against
#     a future Mesa default flip silently moving us to indirect protocol
#     rendering.
#   - -Ddri3 does NOT exist as a meson option in Mesa >= 25.0.0 (removed
#     upstream). Do not re-add it: `meson setup` fails outright with
#     "Unknown option: dri3".
#   - shared-glapi is DELIBERATELY NOT PASSED. The shipped virgl-23.1.9 libGL
#     carries a libglapi.so.0 NEEDED entry satisfied by the copy the base
#     rootfs ships (verified in rootfs.tzst); the Mesa 25/26 xlib target
#     embeds glapi instead (proven on the llvmpipe-25.0.0 asset: no NEEDED
#     entry, 70+ glX symbols in dynsym). Either linkage is CORRECT here, so
#     the workflow detects which one the build produced and gates it
#     accordingly instead of forcing one: NEEDED libglapi -> the CI gate
#     proves the rootfs copy satisfies the loader (never bundled -- shadowing
#     the rootfs file would risk breaking the zink slot, which shares it);
#     no NEEDED -> self-contained, nothing to prove. Passing the option
#     explicitly is a future landmine (deprecated in 26, removal would fail
#     `meson setup` outright, exactly like -Ddri3 did), so it stays omitted.
#   - -Dzstd=disabled: falls back to zlib for the on-disk shader cache. With
#     llvm=disabled no static-LLVM link can re-add a libzstd NEEDED behind
#     our back; the CI gate still proves every NEEDED against the rootfs
#     inventory, so a surprise is caught loudly rather than shipping a dead
#     driver. (The base rootfs ships a NEWER libzstd than jammy anyway, same
#     policy as libz/libdrm/libX11: rootfs-provided, never bundled.)
#   - Extra gallium media/VDPAU/VA/CL targets are left at Mesa defaults: with
#     gallium-drivers=virgl,softpipe they are either skipped or built but never
#     packaged (only libGL.so.* is collected). Deliberately NOT passing
#     -Dgallium-va/-Dgallium-vdpau/-Dgallium-omx: their exact option spelling
#     changed across Mesa majors and a wrong spelling fails `meson setup`
#     outright. Unpackaged extras cost a few build minutes, never correctness.
#   - Mesa's meson needs >= 1.3 (jammy ships 0.61), so a pinned modern meson
#     comes via pip -- same reasoning as the llvmpipe flow (no venv: jammy
#     has no ensurepip; no --break-system-packages: jammy pip 22.0.2 predates
#     the flag and has no PEP 668 guard).
#   - Python on jammy is 3.10, satisfying Mesa's >= 3.10 floor; mako/yaml/ply
#     come from apt (same package list as the llvmpipe flow minus LLVM).

on:
  workflow_dispatch:
    inputs:
      mesa_version:
        description: "Mesa version to build (must exist as mesa-<ver>.tar.xz on archive.mesa3d.org; 25.0.7 recommended, 24.0.x also supported)"
        required: true
        default: "25.0.7"

env:
  MESA_VERSION: ${{ github.event.inputs.mesa_version || '25.0.7' }}
  TARGET_TRIPLE: aarch64-linux-gnu

jobs:
  build-virgl:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Mandatory: registers binfmt_misc handlers so the amd64 runner can
      # execute aarch64 ELF binaries transparently. Without this every
      # command inside --platform=linux/arm64 below fails with "exec format error".
      - name: Set up QEMU (aarch64 emulation)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create output directory
        run: mkdir -p "${{ github.workspace }}/artifacts"

      - name: Write build script part 1 - toolchain and sources
        run: |
          cat > "${{ github.workspace }}/build.sh" <<'PART1_EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive

          MESA_VERSION="${MESA_VERSION:?}"

          echo "==> Neutralizing ldconfig inside the emulated container"
          # DETERMINISTIC fix for the QEMU user-mode ldconfig SIGSEGV (see
          # build-llvmpipe-winlator.yml: binfmt qemu v10.2.3, dpkg exit 139
          # on libc-bin, apt exit 100). Replacing ldconfig with a no-op is
          # safe: this build only needs files/headers/binaries on disk
          # (compiler/linker resolve via explicit -L paths from pkg-config,
          # never via the ld.so cache), and nothing on-device uses
          # ld.so.cache either (the Android linker ignores it). The container
          # is ephemeral (docker run --rm), so no restore is needed.
          if LDCONFIG_PATH="$(command -v ldconfig)"; then
            mv "$LDCONFIG_PATH" "${LDCONFIG_PATH}.qemu-broken"
            printf '#!/bin/sh\nexit 0\n' > "$LDCONFIG_PATH"
            chmod +x "$LDCONFIG_PATH"
            echo "ldconfig neutralized at ${LDCONFIG_PATH}"
          fi

          echo "==> Updating apt and installing mandatory build dependencies"
          apt-get update
          echo "==> Confirming base image glibc version"
          ldd --version | head -n1 || true
          # NOTE: deliberately NO llvm-dev / clang / glslang packages here.
          # virpipe needs no guest-side JIT (-Dllvm=disabled below) and no
          # Vulkan ICD is built (-Dvulkan-drivers= empty), so neither
          # toolchain is required. Fewer packages = smaller QEMU-emulated
          # install = fewer trigger passes over the neutralized ldconfig.
          # -o Dpkg::Options::="--no-triggers" is still MANDATORY under QEMU
          # user-mode emulation (see comment above); a best-effort
          # `ldconfig || true` afterwards refreshes the cache when the
          # emulator can.
          apt-get -o Dpkg::Options::="--no-triggers" install -y --no-install-recommends \
            ca-certificates curl xz-utils git \
            build-essential pkg-config cmake ninja-build \
            python3 python3-pip python3-setuptools python3-wheel \
            python3-mako python3-yaml python3-ply \
            bison flex \
            zstd \
            zlib1g-dev libexpat1-dev \
            libdrm-dev \
            libx11-dev libxext-dev libxfixes-dev libxcb1-dev libxcb-glx0-dev \
            libxcb-shm0-dev libxcb-dri2-0-dev libxcb-dri3-dev libxcb-present-dev \
            libxcb-randr0-dev libxcb-sync-dev libxcb-xfixes0-dev \
            libx11-xcb-dev libxcb-keysyms1-dev \
            libxshmfence-dev libxxf86vm-dev libxrandr-dev
          # Best-effort cache refresh; failure is tolerated (see above).
          ldconfig || true

          # Mesa 25.x needs a meson newer than what jammy packages, so pin a
          # known-good modern meson via pip, installed straight into the
          # system interpreter. Deliberately NOT using `python3 -m venv`
          # (needs the separate python3.10-venv package which isn't installed
          # by default) and deliberately NOT running "pip install --upgrade
          # pip" first (the apt-installed pip has no RECORD metadata, so its
          # self-uninstall step fails) and NOT passing --break-system-packages
          # (that flag only exists on pip 23.0.1+; jammy ships pip 22.0.2,
          # which errors with "no such option" -- and jammy has no PEP 668
          # externally-managed guard in the first place).
          echo "==> Installing pinned meson via pip (system interpreter)"
          python3 -m pip install "meson>=1.4,<2.0"
          hash -r
          meson --version

          echo "==> Fetching Mesa ${MESA_VERSION} source"
          mkdir -p /build && cd /build
          # Retry flags: apt.llvm.org / archive.mesa3d.org are intermittently
          # unreachable from CI (transient curl exit 7 against one host while
          # others work). Zero behavior change on success.
          curl -fL --retry 5 --retry-delay 15 --retry-all-errors \
            -o "mesa-${MESA_VERSION}.tar.xz" \
            "https://archive.mesa3d.org/mesa-${MESA_VERSION}.tar.xz"
          tar xf "mesa-${MESA_VERSION}.tar.xz"
          cd "mesa-${MESA_VERSION}"
          PART1_EOF

      - name: Write wire-compat patch script part A - socket transport
        run: |
          # The frozen in-app host renderer speaks the CLASSIC vtest wire
          # format (command ids 1-9 with the old shapes -- see the header
          # comment), while stock Mesa >= 24 speaks the renumbered upstream
          # protocol. A stock build therefore never interoperates (wrong
          # socket env, unknown command ids, unknown payload shapes). This
          # script rewrites the vtest winsys wire functions to the classic
          # shapes/ids with anchored replacements; every anchor is verified
          # and any drift fails loudly with context instead of shipping a
          # dead driver. The virpipe CORE (the actual bug fixes) stays stock.
          # Written in two parts (this step plus the next) so that no single
          # run: block exceeds the workflow expression length limit.
          cat > "${{ github.workspace }}/patch-virgl.py" <<'PYEOF_A'
          import re
          import sys

          SOCK = "src/gallium/winsys/virgl/vtest/virgl_vtest_socket.c"
          WINS = "src/gallium/winsys/virgl/vtest/virgl_vtest_winsys.c"
          XMST = "src/gallium/frontends/glx/xlib/xm_st.c"
          VSCR = "src/gallium/drivers/virgl/virgl_screen.c"
          failed = []

          def read(path):
              with open(path) as f:
                  return f.read()

          def write(path, text):
              with open(path, "w") as f:
                  f.write(text)

          def show(path, keyword, context=3):
              print("---- context for '%s' in %s ----" % (keyword, path))
              lines = read(path).split("\n")
              shown = 0
              for i, line in enumerate(lines):
                  if keyword in line:
                      lo = max(0, i - context)
                      hi = min(len(lines), i + context + 1)
                      for j in range(lo, hi):
                          print("%5d: %s" % (j + 1, lines[j]))
                      shown += 1
                      if shown >= 4:
                          break
              print("---- end context ----")

          def replace_func(path, sig_pat, new_text, tag, ctx):
              # Replace the whole function whose signature matches sig_pat
              # (spanning to its opening brace) through its matching close
              # brace. Brace matching skips comments/strings/chars. ctx is a
              # plain keyword shown for diagnostics when the anchor drifts.
              src = read(path)
              m = re.search(sig_pat, src, re.S)
              if not m:
                  failed.append(tag + ": signature not found")
                  show(path, ctx)
                  return
              open_idx = len(m.group(0)) + m.start() - 1
              if src[open_idx] != "{":
                  failed.append(tag + ": pattern must end at '{'")
                  show(path, tag)
                  return
              depth = 0
              i = open_idx
              n = len(src)
              state = None
              while i < n:
                  c = src[i]
                  nxt = src[i + 1] if i + 1 < n else ""
                  if state is None:
                      if c == "/" and nxt == "/":
                          state = "//"
                          i += 2
                          continue
                      if c == "/" and nxt == "*":
                          state = "/*"
                          i += 2
                          continue
                      if c == '"':
                          state = '"'
                          i += 1
                          continue
                      if c == "'":
                          state = "'"
                          i += 1
                          continue
                      if c == "{":
                          depth += 1
                      elif c == "}":
                          depth -= 1
                          if depth == 0:
                              break
                  elif state == "//":
                      if c == "\n":
                          state = None
                  elif state == "/*":
                      if c == "*" and nxt == "/":
                          state = None
                          i += 2
                          continue
                  elif state == '"':
                      if c == "\\":
                          i += 2
                          continue
                      if c == '"':
                          state = None
                  elif state == "'":
                      if c == "\\":
                          i += 2
                          continue
                      if c == "'":
                          state = None
                  i += 1
              if depth != 0:
                  failed.append(tag + ": unbalanced braces")
                  return
              write(path, src[:m.start()] + new_text + src[i + 1:])
              print(tag + ": replaced OK")

          def replace_once(path, old, new, tag):
              src = read(path)
              n = src.count(old)
              if n != 1:
                  failed.append(tag + ": anchor found %d times (want 1)" % n)
                  show(path, old.split("\n")[0].strip()[:40])
                  return
              write(path, src.replace(old, new, 1))
              print(tag + ": replaced OK")

          def replace_optional(path, sig_pat, new_text, tag):
              # Like replace_func but tolerant: newer/older Mesa majors may
              # not have the v3 entry point at all. Log and continue instead
              # of failing the build; the mandatory W5 if(0) gate plus the
              # host-side unknown-command drain already cover that case.
              # SAFEGUARD (learned 2026-09-14: a W9 pattern whose first match
              # was a *call site*, not the definition, stretched across
              # neighboring functions and ate their markers, dropping the
              # WINS count 10 -> 9): if the replacement would *reduce* the
              # marker count, restore the original and skip instead.
              import re as _re
              src = read(path)
              if not _re.search(sig_pat, src, _re.S):
                  print(tag + ": not present, skipped OK")
                  return
              before_markers = src.count("Winlator classic")
              before_failed = len(failed)
              replace_func(path, sig_pat, new_text, tag, tag)
              if len(failed) == before_failed:
                  after_markers = read(path).count("Winlator classic")
                  if after_markers < before_markers:
                      write(path, src)
                      print(tag + ": ate %d marker(s), reverted and skipped OK"
                            % (before_markers - after_markers))

          def assert_count(path, sub, want, tag):
              n = read(path).count(sub)
              print("%s: %dx (want %d)" % (tag, n, want))
              if n != want:
                  failed.append(tag + ": got %d, want %d" % (n, want))

          def assert_min(path, sub, want, tag):
              n = read(path).count(sub)
              print("%s: %dx (want >= %d)" % (tag, n, want))
              if n < want:
                  failed.append(tag + ": got %d, want >= %d" % (n, want))

          # --- S-env: fall back to VIRGL_SERVER_PATH ---
          replace_once(SOCK,
          'const char* socket_name = os_get_option("VTEST_SOCKET_NAME");',
          'const char* socket_name = os_get_option("VTEST_SOCKET_NAME");\n'
          '   /* Winlator classic: older app builds export only VIRGL_SERVER_PATH. */\n'
          '   if (!socket_name)\n'
          '      socket_name = os_get_option("VIRGL_SERVER_PATH");',
          "S-env")

          # --- S-inc: string.h + stddef.h for the memset/offsetof below ---
          replace_once(SOCK,
          "#include <unistd.h>",
          "#include <stddef.h>\n"
          "#include <string.h>\n"
          "#include <unistd.h>",
          "S-inc")

          # --- S-init: empty CREATE on classic id 1, no name payload ---
          replace_func(SOCK,
