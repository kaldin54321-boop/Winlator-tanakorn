          # --- S-getcaps: single GET_CAPS on classic id 2 ---
          replace_func(SOCK,
          r"int virgl_vtest_send_get_caps\(.*?\)\s*\{",
          r"""int virgl_vtest_send_get_caps(struct virgl_vtest_winsys *vws,
                                        struct virgl_drm_caps *caps)
          {
             uint32_t req_buf[VTEST_HDR_SIZE];
             uint32_t resp_buf[VTEST_HDR_SIZE];
             uint32_t resp_size, want, got, left, n;
             char dummy[256];
             int ret;

             /* The frozen host's caps_v2 ends at scanout while this Mesa's
              * struct keeps growing (capability_bits_v2, video caps,
              * max_texture_samplers, ...). Zero the whole struct first so
              * fields the host never sends are deterministic 0 instead of
              * stack garbage (garbage capability_bits_v2 would randomly
              * enable staging/copy-transfer paths the classic wire cannot
              * serve). */
             memset(&caps->caps, 0, sizeof(caps->caps));

             /* Winlator classic wire format: a single GET_CAPS (id 2). The frozen
              * host answers once with {caps_size + 1, 2} plus the caps bytes, so
              * the upstream GET_CAPS2 + GET_CAPS double request (which would wait
              * forever for a second reply) must not be used. */
             req_buf[VTEST_CMD_LEN] = 0;
             req_buf[VTEST_CMD_ID] = 2; /* classic VCMD_GET_CAPS */
             virgl_block_write(vws->sock_fd, &req_buf, sizeof(req_buf));

             ret = virgl_block_read(vws->sock_fd, &resp_buf, sizeof(resp_buf));
             if (ret <= 0)
                return 0;

             resp_size = resp_buf[VTEST_CMD_LEN] > 0 ? resp_buf[VTEST_CMD_LEN] - 1 : 0;
             want = sizeof(caps->caps);
             got = resp_size < want ? resp_size : want;
             if (got) {
                ret = virgl_block_read(vws->sock_fd, &caps->caps, got);
                if (ret <= 0)
                   return 0;
             }

             /* Drain anything beyond our caps struct so the stream stays aligned. */
             left = resp_size > got ? resp_size - got : 0;
             while (left) {
                n = left > 256u ? 256u : left;
                ret = virgl_block_read(vws->sock_fd, dummy, n);
                if (ret <= 0)
                   break;
                left -= n;
             }
             /* max_texture_samplers was added after the frozen host's caps_v2
              * (it ends at scanout): with only the memset above it would stay
              * 0 and disable all texture samplers. Default to PIPE's ceiling
              * when the host did not send that far. */
             if (resp_size < offsetof(struct virgl_caps_v2, max_texture_samplers) +
                              sizeof(caps->caps.v2.max_texture_samplers))
                caps->caps.v2.max_texture_samplers = 32;
             return 0;
          }
          """,
           "S-getcaps", "virgl_vtest_send_get_caps")

          # --- S-create: 11-word SHM create on classic id 3 ---
          replace_func(SOCK,
          r"int virgl_vtest_send_resource_create\(.*?\)\s*\{",
          r"""int virgl_vtest_send_resource_create(struct virgl_vtest_winsys *vws,
                                               uint32_t handle,
                                               enum pipe_texture_target target,
                                               uint32_t format,
                                               uint32_t bind,
                                               uint32_t width,
                                               uint32_t height,
                                               uint32_t depth,
                                               uint32_t array_size,
                                               uint32_t last_level,
                                               uint32_t nr_samples,
                                               uint32_t size,
                                               int *out_fd)
          {
             uint32_t res_create_buf[11];
             uint32_t vtest_hdr[VTEST_HDR_SIZE];

             /* Winlator classic wire format: the 11-word create layout (trailing
              * backing size) on the classic VCMD_RESOURCE_CREATE id (3), with the
              * host passing back an SHM fd exactly like upstream CREATE2. The
              * frozen host reads 11 words here; the stock 10-word shape would
              * desync it.
              * RETURNS THE HANDLE (0 = failure): the winsys caller does
              * new_handle = send_resource_create(...); if (new_handle == 0) fail.
              * Returning 0 on success would fail EVERY resource and NULL-deref
              * in TestD3D (page fault at 0). */
             vtest_hdr[VTEST_CMD_LEN] = 11;
             vtest_hdr[VTEST_CMD_ID] = 3; /* classic VCMD_RESOURCE_CREATE */

             res_create_buf[0] = handle;
             res_create_buf[1] = target;
             res_create_buf[2] = format;
             res_create_buf[3] = bind;
             res_create_buf[4] = width;
             res_create_buf[5] = height;
             res_create_buf[6] = depth;
             res_create_buf[7] = array_size;
             res_create_buf[8] = last_level;
             res_create_buf[9] = nr_samples;
             res_create_buf[10] = size;

             virgl_block_write(vws->sock_fd, &vtest_hdr, sizeof(vtest_hdr));
             virgl_block_write(vws->sock_fd, &res_create_buf, sizeof(res_create_buf));

             /* Zero-size resources (e.g. multisample) have no backing store and
              * the host sends no fd for them. */
             if (size == 0) {
                *out_fd = -1;
                return handle;
             }

             *out_fd = virgl_vtest_receive_fd(vws->sock_fd);
             if (*out_fd < 0) {
                fprintf(stderr, "failed to get fd\n");
                return 0;
             }

             return handle;
          }
          """,
           "S-create", "virgl_vtest_send_resource_create")
